[project]
name = "typst-pptx-validate"
version = "0.0.0"
description = "Test-only validators: python-pptx open check, ppt-master checks, LibreOffice visual diff."
requires-python = ">=3.13"
dependencies = [
  "python-pptx>=1.0",
  "lxml>=5",
  "pillow>=11",
  "numpy>=2",
  "scikit-image>=0.25",
  "pypdfium2>=4.30",
  "fonttools>=4.50",
]

[tool.uv]
package = false
