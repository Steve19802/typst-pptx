# Runs format, lint, tests and the fixture validators (plan §11) inside the
# devcontainer, so CI uses exactly the local toolchain. The image is cached
# in GHCR and only pushed from main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      # devcontainer.json joins this network (the agent's network locally).
      TYPST_PPTX_DEV_NETWORK: bridge
    steps:
      - uses: actions/checkout@v5

      # Image names must be lowercase; the owner name may not be.
      - name: Image name and registry login
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/typst-pptx-devcontainer" >> "$GITHUB_ENV"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: make setup check validate
        uses: devcontainers/ci@v0.3
        with:
          imageName: ${{ env.IMAGE }}
          cacheFrom: ${{ env.IMAGE }}
          push: filter
          refFilterForPush: refs/heads/main
          eventFilterForPush: push
          env: CI=true
          runCmd: make setup check validate

      - name: Upload validation output
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: validate
          path: |
            out/validate/*.pptx
            out/validate/*.pdf
            out/validate/lo/
            out/validate/compare/
          if-no-files-found: ignore
