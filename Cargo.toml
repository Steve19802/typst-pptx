[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
authors = ["Esteban Pupillo <esteban@egpworld.com.ar>"]
publish = false

[workspace.dependencies]
pptx-ir = { path = "crates/pptx-ir" }
typst-frontend = { path = "crates/typst-frontend" }
touying-adapter = { path = "crates/touying-adapter" }
animate = { path = "crates/animate" }
layouts = { path = "crates/layouts" }
fallback = { path = "crates/fallback" }
ooxml = { path = "crates/ooxml" }

# Typst crates are pinned exactly: the frame/tag/introspector API changes
# between releases (plan §14).
typst = "=0.15.1"
typst-library = "=0.15.1"
typst-layout = "=0.15.1"
typst-kit = { version = "=0.15.1", features = [
  "embedded-fonts",
  "scan-fonts",
  "system-files",
  "emit-diagnostics",
  "datetime",
] }
typst-svg = "=0.15.1"
typst-render = "=0.15.1"

# rustls instead of OpenSSL for package downloads (static musl builds).
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
# Same versions as typst uses, so its types can be passed through.
ttf-parser = "0.25"
usvg = { version = "0.47", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
clap = { version = "4", features = ["derive", "env"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
