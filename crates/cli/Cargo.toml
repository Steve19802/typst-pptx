[package]
name = "typst-pptx"
description = "Export Typst/Touying decks to editable PowerPoint files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "typst_pptx"
path = "src/lib.rs"

[[bin]]
name = "typst-pptx"
path = "src/main.rs"

[dependencies]
animate.workspace = true
touying-adapter.workspace = true
ooxml.workspace = true
pptx-ir.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
typst-frontend.workspace = true

[dev-dependencies]
serde_json.workspace = true
pptx-ir.workspace = true
insta = { version = "1", features = ["json"] }
zip = { workspace = true, features = ["deflate"] }
